# RGB++ indexer — CKB mainnet / Bitcoin mainnet.
#
# ⚠ VERIFY THE SCRIPT SECTION BEFORE RUNNING.
#
# Deployed code hashes are a property of the deployment you intend to index, not of
# this software. An indexer pointed at the wrong code hash starts cleanly, reports
# healthy, and indexes nothing — so these values are configuration, never constants
# baked into the binary. Cross-check them against the RGB++ deployment your
# application stack uses (for example the script table shipped with `rgbpp-sdk`)
# before pointing this at production.

[general]
network = "mainnet"

[database]
url = "postgres://rgbpp:rgbpp@localhost:5432/rgbpp"
max_connections = 16
auto_migrate = true

[ckb]
rpc_url = "https://mainnet.ckb.dev/rpc"
# The rich indexer usually rides along with the node. Point this elsewhere if you
# run `ckb-indexer` separately.
# indexer_rpc_url = "https://mainnet.ckb.dev/indexer"

# First block where this deployment's RGB++ lock appears on chain, confirmed by
# querying it (`get_transactions`, order "asc", limit 1). Scanning earlier is pure
# waste; scanning later silently misses history. Re-derive after a redeployment.
start_block = 12_611_879

# Stay this far behind the tip. Everything below the line is treated as settled,
# which is what lets this version skip rollback entirely. The window it creates is
# covered by the Bitcoin-driven on-demand path, not by indexing closer to the tip.
reorg_lag = 24

batch_blocks = 500
page_limit = 200

# Concurrent `get_transaction` fetches per scan round. The rich indexer matches
# transactions without returning their bodies, so each match costs a second call;
# these are issued concurrently and applied in order. Raise it against a node on the
# same host — 16 roughly halved a dense range against a public endpoint, and a local
# node has far more headroom.
fetch_concurrency = 8
poll_interval_secs = 5
request_timeout_secs = 30

# Retained for the future rollback design (docs/reorg.md), which needs sparse
# ancestry to find a common ancestor. Nothing else reads these today.
header_retention = 20_000

[btc]
# `esplora` covers mempool.space, blockstream/electrs and self-hosted electrs.
# Switch to `blockbook` by changing these two lines and nothing else.
source = "esplora"
base_url = "https://mempool.space/api"
# source = "blockbook"
# base_url = "https://btc1.trezor.io"

request_timeout_secs = 20
max_concurrency = 8
min_request_interval_ms = 50
# An observation younger than this is still authoritative, so redundant refresh-queue
# entries are dropped instead of re-queried. Does not affect the daily sweep or a
# synchronous API refresh.
observation_ttl_secs = 60

[protocol.rgbpp_lock]
code_hash = "0xbc6c568a1a0d0a09f6844dc9d74ddb4343c32143ff25f727c59edf4fb72d6936"
hash_type = "type"

[protocol.btc_time_lock]
code_hash = "0x70d64497a075bd651e98ac030455ea200637ee325a12ad08aff03f1a117e5a62"
hash_type = "type"

# Type scripts the indexer can label. Unknown type scripts are still indexed — the
# cell is stored with its raw type script and reported as `asset_kind = "unknown"` —
# so this list only affects labelling and fungible-amount decoding. Getting it wrong
# is therefore silent: cells index fine but balances come back empty.
#
# Every entry below was read off this network's chain, not copied from a table.
# Re-derive after a redeployment with:
#
#   curl -s -X POST $CKB_RPC_URL -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0",
#     "id":1,"method":"get_cells","params":[{"script":{"code_hash":"<rgbpp_lock>",
#     "hash_type":"type","args":"0x"},"script_type":"lock","script_search_mode":"prefix",
#     "with_data":true},"desc","0x64"]}'
#
# then group the results by `output.type`. Cells whose data is exactly 16 bytes are
# fungible (the u128 amount); molecule-shaped data containing `dob/0` is Spore.
#
# Sample both ends of the history, not just recent cells. A redeployment does not
# rewrite existing cells, so the list is cumulative: mainnet needs two xUDT entries
# because cells from RGB++'s first weeks still carry the older code hash. Swap "desc"
# for "asc" to see the earliest.

# Currently in use.
[[assets.xudt]]
code_hash = "0xbfa35a9c38a676682b65ade8f02be164d48632281477e36f8dc2f41f79e56bfc"
hash_type = "type"

# The xUDT deployment RGB++ used in its first weeks. Still required: cells created
# back then keep this code hash forever, so dropping it would make every historical
# balance read as `unknown` with no amount.
[[assets.xudt]]
code_hash = "0x50bd8d6680b8b9cf98b73f3c08faf8b2a21914311954118ad6609be6e78a1b95"
hash_type = "data1"

[[assets.spore]]
code_hash = "0x4a4dce1df3dffff7f8b2cd7dff7303df3b6150c9788cb75dcf6747247132b9f5"
hash_type = "data1"

# No sUDT-locked RGB++ cell was observed on mainnet. Add one here if you see
# `asset_kind = "unknown"` on cells whose data is exactly 16 bytes.

[reconcile]
enabled = true
max_outpoints_per_request = 200
queue_interval_secs = 3
queue_batch_size = 100
max_attempts = 5

[sweep]
enabled = true
interval_secs = 86_400
batch_size = 500
misspend_grace_confirmations = 6
# Misspend detection needs a meaningful CKB index: "no transition exists" and "not
# indexed yet" are indistinguishable otherwise. Detection is skipped while the
# scanner is further behind its target than this.
require_synced_within_blocks = 1_000

[verify]
# Cross-check the commitment computed from each CKB transaction against the one
# published in its Bitcoin `OP_RETURN`. The encoding is pinned by regression tests
# built from real on-chain transactions; a mismatch records an anomaly and never
# drops an indexed fact. Set to false to stop the verifier making Bitcoin requests.
commitments = true
batch_size = 100
interval_secs = 30

[log]
# One summary line per window while catching up, instead of one per scan round.
progress_interval_secs = 15
# Periodic operational one-liner: heights, counts, queue depth. 0 disables it.
heartbeat_interval_secs = 300

[api]
bind = "0.0.0.0:8080"
default_page_size = 100
max_page_size = 1000
